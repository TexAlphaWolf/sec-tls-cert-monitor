name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov

  windows:
    name: test (Python 3.14, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: pytest

  evaluation:
    name: measured quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Parser against the reference, corrupt input, diagnoses
        run: |
          python tools/evaluate.py --certs 150 --fuzz 10000 | tee eval.txt
          grep -q "fields that differ: 0$" eval.txt
          grep -q "unexpected exceptions: 0$" eval.txt
          # every scenario must be diagnosed as expected ("N of N")
          awk '/scenarios correct:/ { if ($3 != $5) exit 1 }' eval.txt
          grep -q "scenarios correct:" eval.txt

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: docker build -t tlswatch .
      - name: Runs as a normal user
        run: '[ "$(docker run --rm --entrypoint id tlswatch -u)" != 0 ]'
      - name: Start the demo servers
        run: |
          python tools/demo_server.py --dir "$RUNNER_TEMP/demo" > demo.log &
          for i in $(seq 1 30); do grep -q "config written" demo.log && break; sleep 1; done
          cat demo.log
      - name: A bad fleet exits 1 and names the problems (read-only, no capabilities)
        run: |
          set +e
          docker run --rm --read-only --cap-drop ALL --network host -v "$RUNNER_TEMP/demo:/data:ro" tlswatch check -c /data/hosts.toml | tee out.txt
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" -eq 1 ]
          grep -q "Certificate has expired" out.txt
          grep -q "Certificate is self-signed" out.txt
          grep -q "Certificate is not valid for wrong.example.test" out.txt
      - name: The exporter serves metrics
        run: |
          docker run -d --name exporter --read-only --cap-drop ALL --network host -v "$RUNNER_TEMP/demo:/data:ro" tlswatch serve -c /data/hosts.toml --listen 127.0.0.1:9117 --interval 60
          for i in $(seq 1 60); do curl -sf localhost:9117/metrics -o metrics.txt && break; sleep 1; done
          grep -q '^tlswatch_grade_score{host="127.0.0.1"' metrics.txt
          grep -q '^tlswatch_cert_days_remaining' metrics.txt
          grep -c '^tlswatch_up' metrics.txt | grep -qx 7
          docker stop exporter
