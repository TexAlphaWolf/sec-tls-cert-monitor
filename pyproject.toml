[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlswatch"
version = "1.0.0"
description = "TLS certificate and configuration monitor: expiry, chain, protocols and weak ciphers for a list of hosts, graded A to F, with a Prometheus exporter."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Standard library only at run time: the ssl module and a small X.509 parser of our own.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
  "mypy>=1.10",
  "cryptography>=43",  # tests only: builds the test certificates and cross-checks the parser
  "playwright>=1.45",  # only to render the README screenshot
]

[project.scripts]
tlswatch = "tlswatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["tlswatch"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/*" = ["E501"]  # the formatter wraps code; long messages stay readable
"tests/*" = ["E501"]
"tools/*" = ["E501"]
